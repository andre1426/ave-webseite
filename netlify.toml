# Netlify-Einstellungen für die AVE-Webseite
# Veröffentlicht wird nur der Ordner ave-webseite (kein Build-Schritt nötig).
[build]
  publish = "ave-webseite"
  command = ""

# App-Manifest mit dem offiziellen Dateityp ausliefern
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
